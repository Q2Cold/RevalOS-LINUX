set default=0
set timeout=10

menuentry "Reval OS Live - Desktop" {
    search --no-floppy --file --set=root /live/filesystem.squashfs
    linux /boot/vmlinuz rdinit=/init console=tty0
    initrd /boot/initramfs.gz
}

menuentry "Reval OS Live - Basic graphics" {
    search --no-floppy --file --set=root /live/filesystem.squashfs
    linux /boot/vmlinuz rdinit=/init console=tty0 nomodeset
    initrd /boot/initramfs.gz
}

menuentry "Reval OS Live - Persistent data" {
    search --no-floppy --file --set=root /live/filesystem.squashfs
    linux /boot/vmlinuz rdinit=/init console=tty0 myos.data=5e730f62-efea-41f4-b4ec-a4b5d78992b3
    initrd /boot/initramfs.gz
}
